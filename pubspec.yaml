name: game_app
version: 1.0.4+8
publish_to: none
description: A new Flutter project.
environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  cached_network_image: 
  carousel_slider: ^5.0.0
  cupertino_icons: ^1.0.2
  dotted_border: ^2.0.0+1
  flutter_iconly: ^1.0.2
  firebase_messaging:
  firebase_core: 
  flutter_local_notifications: any
  shared_preferences: ^2.5.3
  get_storage: any
  awesome_notifications: ^0.10.1
  http: any
  image_picker: ^0.8.4+4
  lottie: ^1.2.1
  permission_handler: ^11.0.1
  # share: any
  url_launcher: ^6.3.1
  # restart_app: ^1.1.0
  flutter_html: ^3.0.0-alpha.6
  vibration: ^3.0.0
  mime: ^1.0.1
  pull_to_refresh: 
  flick_video_player: any
  get: ^4.6.5
  file: ^6.1.4
  intl: ^0.20.0
  time_machine: ^0.9.17
  provider: ^6.0.5
  dio: ^5.3.0
  timer_count_down: 
  webview_flutter: ^4.10.0
  change_app_package_name: ^1.1.0
  path_provider: ^2.1.5
  package_info_plus: ^8.3.0
  flutter_image_compress: ^2.4.0
  # media_kit: ^1.1.10
  # media_kit_video: ^1.1.10
  video_player: ^2.10.0
  chewie: ^1.8.5

 

  flutter:
    sdk: flutter
  async: ^2.11.0


dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/lang/
    - assets/lottie/
    - assets/image/
  fonts:
    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy-Bold.ttf
          weight: 700
        - asset: assets/fonts/Gilroy-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Gilroy-Medium.ttf
          weight: 500
        - asset: assets/fonts/Gilroy-Regular.ttf
          weight: 400
  uses-material-design: true
  generate: true
