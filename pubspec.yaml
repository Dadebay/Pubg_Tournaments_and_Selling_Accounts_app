name: game_app
version: 1.0.4+8
publish_to: none
description: A new Flutter project.
environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  # --- Flutter SDK ---
  flutter:
    sdk: flutter
  async: ^2.11.0

  # --- State management & navigation ---
  get: ^4.6.5
  provider: ^6.0.5

  # --- Networking ---
  dio: ^5.3.0
  http: any
  mime: ^2.1.0

  # --- Storage & device info ---
  get_storage: any
  path_provider: ^2.1.5
  permission_handler: ^13.0.2
  vibration: ^3.0.0
  url_launcher: ^6.3.1
  # share: any
  # restart_app: ^1.1.0

  # --- Firebase & notifications ---
  firebase_core:
  firebase_messaging:
  awesome_notifications: ^0.12.1

  # --- Images, media & video ---
  cached_network_image:
  image_picker: ^1.2.4
  flutter_image_compress: ^2.4.0
  video_player: ^2.10.0
  chewie: ^1.8.5
  flick_video_player: any
  # media_kit: ^1.1.10
  # media_kit_video: ^1.1.10

  # --- UI widgets & icons ---
  cupertino_icons: ^1.0.2
  flutter_iconly:
    path: packages/flutter_iconly
  lottie: ^3.8.0
  carousel_slider: ^5.0.0
  dotted_border: ^3.1.0
  pull_to_refresh:
  flutter_html: ^3.0.0-alpha.6
  webview_flutter: ^4.10.0

  # --- Date, time & utils ---
  intl: ^0.20.0
  timer_count_down:
  hugeicons: ^1.1.7
  flutter_svg: ^2.3.2
  share_plus: ^13.3.1

  # --- Tooling ---


dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/icons/brands/
    - assets/lang/
    - assets/lottie/
    - assets/image/
  fonts:
    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy-Bold.ttf
          weight: 700
        - asset: assets/fonts/Gilroy-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Gilroy-Medium.ttf
          weight: 500
        - asset: assets/fonts/Gilroy-Regular.ttf
          weight: 400
    - family: GilroyRegular
      fonts:
        - asset: assets/fonts/Gilroy-Regular.ttf
    - family: GilroyMedium
      fonts:
        - asset: assets/fonts/Gilroy-Medium.ttf
    - family: GilroySemiBold
      fonts:
        - asset: assets/fonts/Gilroy-SemiBold.ttf
    - family: GilroyBold
      fonts:
        - asset: assets/fonts/Gilroy-Bold.ttf
  uses-material-design: true
  generate: true

dependency_overrides:
  html: 0.15.6
